[package]
name = "vibe-diary"
version = "0.5.2"
description = "바이브코딩 다이어리"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools: 릴리스 빌드에서도 우클릭 → 요소 검사 가능 (v0.4.3 진단용).
# 원인 파악되면 다음 패치에서 제거.
tauri = { version = "2", features = ["macos-private-api", "devtools", "unstable"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSURLRequest"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "WKNavigation"] }
url = "2"

[[bin]]
name = "vibe-diary"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
