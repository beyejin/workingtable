name: release

# v0.0.0 형식의 태그를 push 하면 자동으로 빌드·서명·릴리스·latest.json 업로드.
# Windows + macOS(Universal) 둘 다 빌드해서 같은 릴리스에 자산을 올린다.
# (실패한 실행은 Actions 탭에서 'Re-run jobs'로 다시 돌릴 수 있음)
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # 릴리스 생성/자산 업로드에 필요

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            rust-targets: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm deps
        run: npm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "vibe diary ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          releaseBody: |
            ## ⬇️ 다운로드 / Download / ダウンロード

            아래 **Assets**에서 본인 OS에 맞는 파일 하나만 받으세요.

            | OS | 파일 |
            |----|------|
            | Windows | `vibe-diary-yejin_*_x64-setup.exe` |
            | macOS | `vibe-diary-yejin_*_universal.dmg` |

            한 번 설치하면 이후 새 버전은 앱 설정 탭에서 업데이트 확인이 가능합니다.

            <details><summary>macOS에서 "손상되어 열 수 없습니다" 가 뜰 때</summary>

            ```bash
            xattr -dr com.apple.quarantine "/Applications/vibe-diary-yejin.app"
            ```

            </details>

      - name: Generate latest.json
        if: matrix.platform == 'macos-latest'
        run: |
          APP_ARCHIVE=$(find src-tauri/target -path "*/bundle/macos/*.app.tar.gz" -type f | head -n 1)
          if [ -z "$APP_ARCHIVE" ]; then
            echo "Could not find macOS updater archive"
            find src-tauri/target -type f \( -name "*.app.tar.gz" -o -name "*.sig" \) || true
            exit 1
          fi

          APP_ARCHIVE_BASENAME=$(basename "$APP_ARCHIVE")
          APP_ARCHIVE_NAME="${APP_ARCHIVE_BASENAME/.app.tar.gz/_universal.app.tar.gz}"
          SIG=$(cat "$APP_ARCHIVE.sig")
          APP_URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/${APP_ARCHIVE_NAME}"

          cat > latest.json <<EOF
          {
            "version": "${GITHUB_REF_NAME#v}",
            "notes": "Automatic release build",
            "pub_date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "platforms": {
              "darwin-aarch64": {
                "signature": "$SIG",
                "url": "$APP_URL"
              },
              "darwin-x86_64": {
                "signature": "$SIG",
                "url": "$APP_URL"
              }
            }
          }
          EOF

      - name: Upload latest.json
        if: matrix.platform == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json
